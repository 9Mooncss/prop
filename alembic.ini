# Used only for `alembic revision --autogenerate` during development.
# Runtime migrations: `propguard db upgrade` (reads PROPGUARD_DATABASE_URL).
[alembic]
script_location = propguard/db/migrations
sqlalchemy.url = sqlite:///./data/dev-autogen.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
