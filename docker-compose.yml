# One command: docker compose up -d   (then open http://127.0.0.1:8000)
name: propguard
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propguard
      POSTGRES_USER: propguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propguard -d propguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: propguard:local
    command: ["api"]
    env_file: .env
    environment:
      PROPGUARD_DATABASE_URL: postgresql+psycopg://propguard:${POSTGRES_PASSWORD}@db:5432/propguard
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:${PROPGUARD_PORT:-8000}:8000"   # loopback only; use a reverse proxy/VPN for remote access
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    image: propguard:local
    command: ["worker"]
    env_file: .env
    environment:
      PROPGUARD_DATABASE_URL: postgresql+psycopg://propguard:${POSTGRES_PASSWORD}@db:5432/propguard
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime,pathlib,sys; t=datetime.datetime.fromisoformat(pathlib.Path('/data/worker.heartbeat').read_text()); sys.exit(0 if (datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
