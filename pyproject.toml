[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propguard"
version = "0.1.0"
description = "Self-hosted prop-firm research, rule registry and deterministic risk envelope"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.60"]
keyring = ["keyring>=25"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
propguard = "propguard.cli:main"

[tool.setuptools.packages.find]
include = ["propguard*"]

[tool.setuptools.package-data]
propguard = ["api/templates/*.html", "api/static/*", "db/migrations/*.py", "db/migrations/versions/*.py", "db/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "risk: Risk Engine acceptance suite (must pass before LIVE can be enabled)",
  "integration: integration tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"propguard/cli.py" = ["E702"]
